  <script>
    // Script "anti-flicker"
    (function() {
      const KEY = 'modo';
      const LIGHT_CLASS = 'light-theme';
      var currentModo = 0;
      try {
        // Tenta ler o modo salvo no localStorage
        currentModo = Number(localStorage.getItem(KEY)) || 0;
      } catch(e) { /* se falhar, usa 0 (dark) */ }
      
      // Aplica a classe na tag <html> ANTES de desenhar
      // document.documentElement é a tag <html>
      document.documentElement.classList.toggle(LIGHT_CLASS, currentModo === 1);
    })();
  </script>
